<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | FinalFunnel Asset Manager</title>

  <!-- Tailwind CDN (layout utilities only — colors/components come from theme.css) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="bg-body flex items-center justify-center min-h-screen">

  <div class="card w-[360px]">
    <!-- 🖼️ Logo -->
    <div class="flex justify-center mb-4">
     <img src="assets/Finalfunel04.png" alt="FinalFunnel Logo" width="160">
    </div>

    <h2 class="text-center text-xl font-semibold mb-5" style="color: var(--color-text);">Admin Login</h2>

    <form id="loginForm" novalidate>
      <!-- Email -->
      <label for="email" class="form-label">Email</label>
      <input id="email"
             type="text"
             placeholder="you@company.com"
             autocomplete="username"
             class="form-input mb-3"/>

      <!-- Password with toggle eye -->
      <label for="password" class="form-label">Password</label>
      <div class="relative mb-4">
        <input id="password" type="password"
               placeholder="••••••••"
               autocomplete="current-password"
               class="form-input pr-10"/>

        <button id="togglePwd" type="button" aria-label="Show password" class="absolute inset-y-0 right-0 flex items-center px-3" style="color: var(--color-text-muted);">
          <!-- eye open -->
          <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.522 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S3.732 16.057 2.458 12z"/>
          </svg>
          <!-- eye off -->
          <svg id="eyeOff" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.044 10.044 0 013.016-4.605m14.033.19A10.05 10.05 0 0121.542 12c-1.274 4.057-5.064 7-9.542 7a10.05 10.05 0 01-1.875-.175M15 12a3 3 0 11-6 0 3 3 0 016 0zm-9.9-5.1L4.2 4.2m15.6 15.6L19.8 19.8"/>
          </svg>
        </button>
      </div>

      <!-- Login button with spinner -->
      <button id="loginBtn" type="submit" class="btn-primary w-full flex justify-center items-center gap-2">
        <span>Sign in</span>
        <svg id="loader" class="animate-spin h-5 w-5 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z" />
        </svg>
      </button>

      <div id="error" class="text-sm mt-3 text-center hidden" style="color: var(--color-danger-hover);" role="alert"></div>
    </form>
  </div>

<script type="module">
  import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { auth } from "./firebase-client.js";
  const loginForm = document.getElementById("loginForm");
  const loginBtn = document.getElementById("loginBtn");
  const loader   = document.getElementById("loader");
  const errorDiv = document.getElementById("error");

  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    errorDiv.classList.add("hidden");

    if (!email || !password) {
      errorDiv.textContent = "Please enter both email and password.";
      errorDiv.classList.remove("hidden");
      return;
    }

    loader.classList.remove("hidden");
    loginBtn.disabled = true;
      signInWithEmailAndPassword(auth, email, password)
      .then(() => {
        window.location.href = "add-asset.html";
      })
      .catch((error) => {
        let msg;
        switch (error.code) {
          case 'auth/user-not-found':     msg = "No user found."; break;
          case 'auth/wrong-password':     msg = "Incorrect password."; break;
          case 'auth/invalid-email':      msg = "Invalid email."; break;
          case 'auth/invalid-credential': msg = "Invalid credentials."; break;
          case 'auth/too-many-requests':  msg = "Too many attempts."; break;
          default:                        msg = "Login failed: " + error.message;
        }
        errorDiv.textContent = msg;
        errorDiv.classList.remove("hidden");
        loader.classList.add("hidden");
        loginBtn.disabled = false;
      });
  });

   // Show / Hide password
  const pwd = document.getElementById("password");
  const toggle = document.getElementById("togglePwd");
  const eyeOpen = document.getElementById("eyeOpen");
  const eyeOff  = document.getElementById("eyeOff");
  
    toggle.addEventListener("click", () => {
    const isHidden = pwd.type === "password";
    pwd.type = isHidden ? "text" : "password";
    eyeOpen.classList.toggle("hidden", isHidden);
    eyeOff.classList.toggle("hidden", !isHidden);
  });
</script>
</body>
</html>
